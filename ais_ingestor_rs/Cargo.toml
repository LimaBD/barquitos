[package]
name = "ais_ingestor_rs"
version = "0.1.0"
edition = "2021"
description = "File-based AIS Data Lake ingestion pipeline — reads JSONL from collector, writes Parquet"

[[bin]]
name = "ais_ingestor"
path = "src/main.rs"

[[bin]]
name = "ais_backfill"
path = "src/backfill.rs"

[dependencies]
# Arrow / Parquet — low-level, zero-copy columnar writes
# Minimal features: no prettyprint (pulls comfy-table requiring nightly)
arrow-array = "54"
arrow-schema = "54"
arrow-select = "54"
arrow-ord = "54"
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd"] }

# Time handling — strict UTC everywhere
chrono = { version = "0.4", features = ["serde"] }

# JSON deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Signal handling for graceful shutdown
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
